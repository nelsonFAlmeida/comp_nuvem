server:
  port: 8083

spring:
  application:
    name: order-service
  
  datasource:
    url: jdbc:h2:mem:orderdb
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  
  h2:
    console:
      enabled: true
      path: /h2-console
  
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  
  cloud:
    aws:
      region:
        static: eu-west-1
      sqs:
        endpoint: ${CLOUD_AWS_SQS_ENDPOINT:https://sqs.eu-west-1.amazonaws.com}
        listener:
          max-concurrent-messages: 10
          poll-timeout: 10

# Feign Client Configuration
feign:
  client:
    config:
      default:
        connectTimeout: 5000
        readTimeout: 5000
        loggerLevel: basic

# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    tags-sorter: alpha
    operations-sorter: alpha
  info:
    title: Order Service API
    description: Microservice for order management with AWS SQS and OpenFeign
    version: 1.0.0
    contact:
      name: Cloud Computing Course
      email: support@example.com

# Service URLs (for Feign clients)
services:
  user:
    url: http://localhost:8081
  product:
    url: http://localhost:8082

