server:
  port: 8083
  forward-headers-strategy: framework

spring:
  application:
    name: order-service
  
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:orderdb}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  
  h2:
    console:
      enabled: false
  
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: ${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.H2Dialect}
  
  cloud:
    discovery:
      enabled: false
    aws:
      region:
        static: eu-west-1
      sqs:
        endpoint: ${CLOUD_AWS_SQS_ENDPOINT:https://sqs.eu-west-1.amazonaws.com}
        listener:
          max-concurrent-messages: 10
          poll-timeout: 10

# Feign Client Configuration
feign:
  client:
    config:
      default:
        connectTimeout: 5000
        readTimeout: 5000
        loggerLevel: basic

# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    tags-sorter: alpha
    operations-sorter: alpha
  info:
    title: Order Service API
    description: Microservice for order management with AWS SQS and OpenFeign
    version: 1.0.0
    contact:
      name: Cloud Computing Course
      email: support@example.com

# Service URLs (for Feign clients)
# In Docker/AWS the env vars SERVICES_USER_URL / SERVICES_PRODUCT_URL are injected
# by docker-compose.yml. The fallback values use Docker DNS service names.
services:
  user:
    url: ${SERVICES_USER_URL:http://user-service:8081}
  product:
    url: ${SERVICES_PRODUCT_URL:http://product-service:8082}

