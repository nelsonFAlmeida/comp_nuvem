spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: user-service-docs
          uri: ${SERVICES_USER_URL:http://localhost:8081}
          predicates:
            - Path=/v3/api-docs/user-service
          filters:
            - RewritePath=/v3/api-docs/user-service, /api-docs
        - id: user-service
          uri: ${SERVICES_USER_URL:http://localhost:8081}
          predicates:
            - Path=/api/users/**
          filters:
            - StripPrefix=1
        - id: product-service-docs
          uri: ${SERVICES_PRODUCT_URL:http://localhost:8082}
          predicates:
            - Path=/v3/api-docs/product-service
          filters:
            - RewritePath=/v3/api-docs/product-service, /api-docs
        - id: product-service
          uri: ${SERVICES_PRODUCT_URL:http://localhost:8082}
          predicates:
            - Path=/api/products/**
          filters:
            - StripPrefix=1
        - id: order-service-docs
          uri: ${SERVICES_ORDER_URL:http://localhost:8083}
          predicates:
            - Path=/v3/api-docs/order-service
          filters:
            - RewritePath=/v3/api-docs/order-service, /api-docs
        - id: order-service
          uri: ${SERVICES_ORDER_URL:http://localhost:8083}
          predicates:
            - Path=/api/orders/**
          filters:
            - StripPrefix=1

server:
  port: 8080
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway,prometheus,metrics
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    urls:
      - name: User Service
        url: /v3/api-docs/user-service
      - name: Product Service
        url: /v3/api-docs/product-service
      - name: Order Service
        url: /v3/api-docs/order-service
  info:
    title: API Gateway
    description: Single entry point for all microservices
    version: 1.0.0
    contact:
      name: Cloud Computing Course
      email: support@example.com

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    pt.ulusofona.apigateway: DEBUG

