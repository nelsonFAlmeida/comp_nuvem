name: Deploy Production

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service:
          - user-service
          - product-service
          - order-service
          - api-gateway

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: services/${{ matrix.service }}/pom.xml

      - name: Build service with Maven
        working-directory: services/${{ matrix.service }}
        run: mvn -B clean package -DskipTests

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        working-directory: services/${{ matrix.service }}
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE=ghcr.io/${OWNER}/${{ matrix.service }}
          docker build -t "$IMAGE:latest" -t "$IMAGE:${{ github.sha }}" .
          docker push "$IMAGE:latest"
          docker push "$IMAGE:${{ github.sha }}"

  terraform-apply:
    runs-on: ubuntu-latest
    needs: build-and-push

    permissions:
      contents: read
      id-token: write

    outputs:
      ec2_public_ip: ${{ steps.tf_outputs.outputs.ec2_public_ip }}
      rds_endpoint: ${{ steps.tf_outputs.outputs.rds_endpoint }}
      sqs_queue_url: ${{ steps.tf_outputs.outputs.sqs_queue_url }}

    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: eu-west-1

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform init
        run: terraform init -input=false

      - name: Terraform apply
        run: terraform apply -auto-approve -input=false

      - name: Capture Terraform outputs
        id: tf_outputs
        run: |
          echo "ec2_public_ip=$(terraform output -raw ec2_public_ip)" >> "$GITHUB_OUTPUT"
          echo "rds_endpoint=$(terraform output -raw rds_endpoint)" >> "$GITHUB_OUTPUT"
          echo "sqs_queue_url=$(terraform output -raw sqs_queue_url)" >> "$GITHUB_OUTPUT"

  ansible-deploy:
    runs-on: ubuntu-latest
    needs: terraform-apply

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Ansible
        run: |
          sudo apt-get update
          sudo apt-get install -y ansible

      - name: Write SSH private key
        run: |
          printf '%s' "${{ secrets.EC2_SSH_KEY }}" | tr -d '\r' > key.pem
          chmod 400 key.pem

      - name: Create dynamic inventory
        run: |
          cat > inventory.ini <<EOF
          [web]
          ${{ needs.terraform-apply.outputs.ec2_public_ip }} ansible_user=ubuntu ansible_ssh_private_key_file=${{ github.workspace }}/key.pem ansible_ssh_common_args='-o StrictHostKeyChecking=no'
          EOF

      - name: Run Ansible deploy playbook
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          ansible-playbook -i inventory.ini ansible/playbooks/deploy.yml \
            --extra-vars "db_url=${{ needs.terraform-apply.outputs.rds_endpoint }} db_user=postgres db_pass=${DB_PASSWORD} sqs_url=${{ needs.terraform-apply.outputs.sqs_queue_url }}"